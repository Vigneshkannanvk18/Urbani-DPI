# Reverse proxy + SPA static host (Part 4).
# The browser only ever talks to this server. `/api/*` is proxied to the backend
# service over the Docker network (service name "backend"); everything else is
# served as the SPA with history-mode fallback. The backend host is never
# exposed to the client.

upstream urbani_backend {
    server backend:4000;
}

server {
    listen 8080;
    server_name _;

    # Security headers for the static app (the API sets its own).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy container healthcheck target (does not hit the backend).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API + health/readiness -> backend over the Docker network.
    location /api/ {
        proxy_pass http://urbani_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache immutable hashed assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: unknown routes return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
