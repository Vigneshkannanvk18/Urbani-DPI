<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Urbani">
  <!-- Urbani logo mark, redrawn as vector from the supplied logo image (purple gradient tile, white "U" with the cyan dot).
       Replace with the original vector/PNG file from Urbani when available (docs/BRANDING.md). -->
  <defs>
    <linearGradient id="urbani-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a321ff"/>
      <stop offset="1" stop-color="#6a2eff"/>
    </linearGradient>
    <clipPath id="urbani-left"><rect x="0" y="0" width="247" height="512"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#urbani-bg)"/>
  <circle cx="364" cy="131" r="47" fill="#00d1ff"/>
  <!-- solid right stem of the U (also the stem of the "i") -->
  <path d="M318 190H412V275A155 155 0 0 1 256 430V336A61 61 0 0 0 318 275Z" fill="#ffffff"/>
  <!-- three concentric strokes on the left side of the U, cut at the centre line -->
  <g clip-path="url(#urbani-left)" fill="none" stroke="#ffffff">
    <path d="M107 113V275A150 150 0 0 0 257 425" stroke-width="10"/>
    <path d="M147.5 113V275A109.5 109.5 0 0 0 257 384.5" stroke-width="39"/>
    <path d="M188 113V275A69 69 0 0 0 257 344" stroke-width="14"/>
  </g>
</svg>
