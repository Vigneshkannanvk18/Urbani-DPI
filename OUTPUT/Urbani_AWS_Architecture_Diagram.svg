<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="880" viewBox="0 0 1480 880" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .zone-title { font-size: 15px; font-weight: 700; }
      .node-title { font-size: 12.5px; font-weight: 700; fill: #1a1a2e; }
      .node-sub   { font-size: 10.5px; fill: #5a6472; }
      .node-mono  { font-size: 9px; fill: #5a6472; font-family: 'Consolas','Courier New',monospace; }
      .bullet { font-size: 10px; fill: #4a5568; }
      .grp   { font-size: 12.5px; font-weight: 700; fill: #2d3748; }
      .small { font-size: 10px; fill: #4a5568; }
      .flowlbl { font-size: 10px; fill: #6b7280; font-style: italic; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4a5568"/>
    </marker>
    <marker id="arrowDash" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a94a6"/>
    </marker>
  </defs>

  <rect width="1480" height="880" fill="#ffffff"/>

  <!-- Title -->
  <text x="28" y="34" font-size="21" font-weight="800" fill="#16213e">URBANI — Proactive Observability &amp; AI Troubleshooting Assistant</text>
  <text x="28" y="54" font-size="12.5" fill="#6b7280">Target AWS Architecture · Read-only · Evidence-based · Human-in-the-loop · 5-minute telemetry loop</text>

  <!-- ============ Application / Services (Existing) ============ -->
  <rect x="20" y="80" width="210" height="366" rx="10" fill="#f4f6fb" stroke="#c7d0e0" stroke-width="1.5"/>
  <text x="36" y="106" class="grp">Application / Services</text>
  <text x="36" y="123" class="small">(Existing — Urbani)</text>

  <g transform="translate(36,138)">
    <rect x="0" y="0" width="178" height="48" rx="7" fill="#fff" stroke="#e07b39" stroke-width="1.5"/>
    <rect x="12" y="12" width="24" height="24" rx="5" fill="#e07b39"/>
    <text x="46" y="21" class="node-title">Elastic Beanstalk</text>
    <text x="46" y="37" class="node-sub">urbani-app (primary)</text>
  </g>
  <g transform="translate(36,196)">
    <rect x="0" y="0" width="178" height="44" rx="7" fill="#fff" stroke="#cfd6e4" stroke-width="1.5"/>
    <rect x="12" y="10" width="24" height="24" rx="5" fill="#7aa1d2"/>
    <text x="46" y="19" class="node-title">EC2 / ECS / EKS</text>
    <text x="46" y="34" class="node-sub">apps &amp; containers</text>
  </g>
  <g transform="translate(36,250)">
    <rect x="0" y="0" width="178" height="44" rx="7" fill="#fff" stroke="#cfd6e4" stroke-width="1.5"/>
    <rect x="12" y="10" width="24" height="24" rx="5" fill="#d98a3d"/>
    <text x="46" y="19" class="node-title">Lambda apps</text>
    <text x="46" y="34" class="node-sub">serverless services</text>
  </g>
  <g transform="translate(36,304)">
    <rect x="0" y="0" width="178" height="44" rx="7" fill="#fff" stroke="#cfd6e4" stroke-width="1.5"/>
    <rect x="12" y="10" width="24" height="24" rx="5" fill="#5c8bd6"/>
    <text x="46" y="19" class="node-title">RDS</text>
    <text x="46" y="34" class="node-sub">databases</text>
  </g>
  <g transform="translate(36,358)">
    <rect x="0" y="0" width="178" height="44" rx="7" fill="#fff" stroke="#cfd6e4" stroke-width="1.5"/>
    <rect x="12" y="10" width="24" height="24" rx="5" fill="#aab4c5"/>
    <text x="46" y="19" class="node-title">Other AWS services</text>
    <text x="46" y="34" class="node-sub">future scope</text>
  </g>

  <!-- flow label into cloud -->
  <line x1="230" y1="162" x2="272" y2="162" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="232" y="153" class="flowlbl">App logs</text>
  <text x="232" y="178" class="flowlbl">/ metrics</text>

  <!-- ============ AWS Cloud boundary ============ -->
  <rect x="274" y="80" width="1186" height="590" rx="12" fill="#fbfcfe" stroke="#232f3e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="288" y="92" width="32" height="24" rx="4" fill="#232f3e"/>
  <text x="304" y="109" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">aws</text>
  <text x="330" y="110" font-size="13.5" font-weight="800" fill="#232f3e">AWS Cloud (Urbani Sandbox / Account)</text>

  <!-- ===== Zone: Monitoring & Log Collection ===== -->
  <rect x="290" y="128" width="530" height="268" rx="10" fill="#fdeef0" stroke="#f3b9c2" stroke-width="1.5"/>
  <text x="306" y="152" class="zone-title" fill="#c0304a">Monitoring &amp; Log Collection (every 5 minutes)</text>

  <!-- 1 CloudWatch -->
  <g transform="translate(306,172)">
    <rect x="0" y="0" width="148" height="70" rx="8" fill="#fff" stroke="#e6446a" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#e6446a"/>
    <text x="52" y="26" class="node-title">Amazon</text>
    <text x="52" y="41" class="node-title">CloudWatch</text>
    <text x="14" y="62" class="node-sub">Logs &amp; Metrics</text>
    <circle cx="6" cy="6" r="11" fill="#16213e"/><text x="6" y="10" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">1</text>
  </g>
  <text x="308" y="264" class="bullet">• App / system logs</text>
  <text x="308" y="280" class="bullet">• Metrics · 30-day retention</text>
  <text x="308" y="296" class="node-mono">/aws/elasticbeanstalk/urbani-app</text>

  <!-- 2 EventBridge -->
  <g transform="translate(478,172)">
    <rect x="0" y="0" width="150" height="70" rx="8" fill="#fff" stroke="#e6446a" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#c0304a"/>
    <text x="52" y="26" class="node-title">EventBridge</text>
    <text x="52" y="41" class="node-title">Scheduler</text>
    <text x="14" y="62" class="node-sub">rate(5 minutes)</text>
    <circle cx="6" cy="6" r="11" fill="#16213e"/><text x="6" y="10" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">2</text>
  </g>
  <text x="480" y="264" class="bullet">• Runs every 5 min</text>
  <text x="480" y="280" class="bullet">• 288 runs / day</text>
  <text x="480" y="296" class="bullet">• Bounds token cost</text>

  <!-- 3 Lambda Collector -->
  <g transform="translate(652,172)">
    <rect x="0" y="0" width="152" height="70" rx="8" fill="#fff" stroke="#e6446a" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#d9832f"/>
    <text x="52" y="26" class="node-title">Lambda</text>
    <text x="52" y="41" class="node-title">Collector</text>
    <text x="14" y="62" class="node-mono">UrbaniTelemetryCollectorFn</text>
    <circle cx="6" cy="6" r="11" fill="#16213e"/><text x="6" y="10" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">3</text>
  </g>
  <text x="654" y="264" class="bullet">• Queries CloudWatch Insights</text>
  <text x="654" y="280" class="bullet">• Filters errors / exceptions</text>
  <text x="654" y="296" class="bullet">• Max 100 log lines / cycle</text>

  <!-- arrows within zone -->
  <line x1="456" y1="207" x2="476" y2="207" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="207" x2="650" y2="207" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 -> 4 connector across zones -->
  <line x1="820" y1="207" x2="854" y2="207" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Zone: AI Analysis & Alert Processing ===== -->
  <rect x="858" y="128" width="586" height="268" rx="10" fill="#e9f7f2" stroke="#a7ddc9" stroke-width="1.5"/>
  <text x="874" y="152" class="zone-title" fill="#1c7d5a">AI Analysis &amp; Alert Processing</text>

  <!-- 4 Bedrock -->
  <g transform="translate(874,172)">
    <rect x="0" y="0" width="278" height="70" rx="8" fill="#fff" stroke="#1c9e78" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#1c9e78"/>
    <text x="52" y="24" class="node-title">Amazon Bedrock (LLM Analysis)</text>
    <text x="52" y="40" class="node-sub">Claude 3.5 Sonnet v2 (primary)</text>
    <text x="52" y="56" class="node-mono">anthropic.claude-3-5-sonnet-20241022-v2:0</text>
    <circle cx="6" cy="6" r="11" fill="#16213e"/><text x="6" y="10" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">4</text>
  </g>
  <text x="876" y="264" class="bullet">• Analyzes log patterns · cites evidence</text>
  <text x="876" y="280" class="bullet">• Suggests root cause + recommendations</text>
  <text x="876" y="296" class="bullet">• temp 0.0 · max_tokens 1024 · top_p 1.0</text>
  <text x="876" y="312" class="bullet">• Fallback: Nova Pro / Nova Lite</text>

  <!-- 5 Bedrock -> Guardrails -->
  <line x1="1152" y1="207" x2="1176" y2="207" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="1164" cy="207" r="11" fill="#16213e"/><text x="1164" y="211" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">5</text>

  <!-- Guardrails -->
  <g transform="translate(1178,172)">
    <rect x="0" y="0" width="252" height="70" rx="8" fill="#fff" stroke="#1c9e78" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#0f7d5c"/>
    <text x="52" y="24" class="node-title">Bedrock Guardrails</text>
    <text x="52" y="40" class="node-mono">urbani-dpi-guardrail-v1</text>
    <text x="52" y="56" class="node-sub">Safety &amp; compliance</text>
  </g>
  <text x="1180" y="264" class="bullet">• PII redaction (IPs, keys, tokens)</text>
  <text x="1180" y="280" class="bullet">• Prompt-injection defense</text>
  <text x="1180" y="296" class="bullet">• No unsupported / auto commands</text>
  <text x="1180" y="312" class="node-mono" font-size="9.5">• NO_ANOMALY_DETECTED if no evidence</text>

  <!-- ===== Zone: Alert Storage & Visualization ===== -->
  <rect x="290" y="430" width="700" height="222" rx="10" fill="#eef7ea" stroke="#bfe0ad" stroke-width="1.5"/>
  <text x="306" y="454" class="zone-title" fill="#3a7d1c">Alert Storage &amp; Visualization</text>

  <!-- 7 Lambda Alert Writer -->
  <g transform="translate(650,470)">
    <rect x="0" y="0" width="160" height="70" rx="8" fill="#fff" stroke="#d9832f" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#d9832f"/>
    <text x="52" y="26" class="node-title">Lambda</text>
    <text x="52" y="41" class="node-title">Alert Writer</text>
    <text x="14" y="62" class="node-mono">UrbaniAlertWriterFn</text>
    <circle cx="6" cy="6" r="11" fill="#16213e"/><text x="6" y="10" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">7</text>
  </g>
  <text x="652" y="562" class="bullet">• Validates strict JSON schema</text>
  <text x="652" y="578" class="bullet">• Formats UrbaniIncidentAlert</text>
  <text x="652" y="594" class="bullet">• Writes finding to DynamoDB</text>

  <!-- DynamoDB -->
  <g transform="translate(320,470)">
    <rect x="0" y="0" width="180" height="70" rx="8" fill="#fff" stroke="#7a4dd6" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#7a4dd6"/>
    <text x="52" y="26" class="node-title">Amazon DynamoDB</text>
    <text x="52" y="41" class="node-sub">UrbaniAlerts</text>
    <text x="14" y="62" class="node-sub">Encrypted at rest (KMS)</text>
    <circle cx="6" cy="6" r="11" fill="#16213e"/><text x="6" y="10" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">6</text>
  </g>
  <text x="322" y="562" class="node-mono">PK service_id · SK timestamp</text>
  <text x="322" y="578" class="node-mono">GSI anomaly_type-index</text>
  <text x="322" y="594" class="bullet">• Alert history &amp; pattern memory</text>

  <!-- 7 -> 6 (writer to dynamo) -->
  <line x1="648" y1="505" x2="504" y2="505" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 6 label: guardrails down to alert writer -->
  <path d="M1304,242 L1304,340 L730,340 L730,468" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="333" class="flowlbl">Structured JSON finding → Alert Writer</text>

  <!-- ===== Dashboard node (step 8) ===== -->
  <g transform="translate(1030,470)">
    <rect x="0" y="0" width="200" height="70" rx="8" fill="#fff" stroke="#e6446a" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#e6446a"/>
    <text x="52" y="24" class="node-title">Observability Dashboard</text>
    <text x="52" y="40" class="node-sub">CloudWatch / Managed Grafana</text>
    <text x="52" y="56" class="node-sub">+ Urbani Admin Dashboard</text>
    <circle cx="6" cy="6" r="11" fill="#16213e"/><text x="6" y="10" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">8</text>
  </g>
  <text x="1030" y="562" class="bullet">• Active alerts + evidence snippet</text>
  <text x="1030" y="578" class="bullet">• Recommended runbook steps</text>
  <text x="1030" y="594" class="bullet">• Error trends · service health</text>

  <!-- dynamo -> dashboard (dashed query), routed below the storage-zone nodes -->
  <path d="M430,540 L430,614 L1130,614 L1130,544" fill="none" stroke="#8a94a6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="700" y="608" class="flowlbl">Dashboard queries DynamoDB for active alerts</text>

  <!-- caption for the human-in-the-loop view arrow, placed in the gap band above its corridor -->
  <text x="470" y="681" class="flowlbl" fill="#8a94a6">Engineers view alerts &amp; AI insights (human-in-the-loop) — no automated action</text>

  <!-- ===== Notifications (optional / out of scope) ===== -->
  <g transform="translate(1246,470)">
    <rect x="0" y="0" width="196" height="140" rx="8" fill="#faf3fb" stroke="#d9a6e0" stroke-width="1.5" stroke-dasharray="5 3"/>
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#b25bc0"/>
    <text x="50" y="26" class="node-title">Amazon SNS</text>
    <text x="50" y="40" class="node-sub">Notifications</text>
    <text x="16" y="66" class="bullet" font-weight="700" fill="#8a3a97">Optional — OUT of MVP scope</text>
    <text x="16" y="86" class="bullet">• Email / Teams / Slack alerts</text>
    <text x="16" y="104" class="bullet">• Critical error escalation</text>
    <text x="16" y="122" class="bullet">• Deferred to roadmap phase 4</text>
  </g>

  <!-- ============ Users / Team ============ -->
  <rect x="20" y="478" width="210" height="162" rx="10" fill="#f4f6fb" stroke="#c7d0e0" stroke-width="1.5"/>
  <text x="36" y="504" class="grp">Users / Team</text>
  <g transform="translate(36,516)">
    <circle cx="26" cy="30" r="13" fill="#5c8bd6"/><text x="26" y="60" class="small" text-anchor="middle">Operations</text>
    <circle cx="92" cy="30" r="13" fill="#1c9e78"/><text x="92" y="60" class="small" text-anchor="middle">Development</text>
    <circle cx="158" cy="30" r="13" fill="#d9832f"/><text x="158" y="60" class="small" text-anchor="middle">Support</text>
  </g>
  <text x="36" y="606" class="small">Step 9 · Engineer reviews evidence,</text>
  <text x="36" y="622" class="small">validates &amp; applies fix (manual)</text>

  <!-- dashboard -> users (view): from dashboard left edge, down into the gap below the storage zone, left, then up into Users panel -->
  <path d="M1080,540 L1080,687 L150,687 L150,642" fill="none" stroke="#8a94a6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>

  <!-- ============ Key configuration / governance ============ -->
  <rect x="20" y="692" width="1440" height="164" rx="10" fill="#f7f9fc" stroke="#c7d0e0" stroke-width="1.5"/>
  <text x="36" y="718" class="grp">Key Configuration &amp; Governance</text>

  <text x="36"  y="744" class="bullet">• EventBridge cadence: every 5 minutes (288 runs/day)</text>
  <text x="36"  y="766" class="bullet">• Telemetry window capped at 100 log lines (~1,500 tokens)</text>
  <text x="36"  y="788" class="bullet">• Bedrock: temperature 0.0, max_tokens 1024, top_p 1.0</text>
  <text x="36"  y="810" class="bullet">• Read-only IAM (UrbaniCollectorExecutionRole) — least privilege</text>

  <text x="540" y="744" class="bullet">• KMS encryption at rest (DynamoDB, logs, Bedrock logs)</text>
  <text x="540" y="766" class="bullet">• CloudTrail auditing of Bedrock / Lambda / DynamoDB calls</text>
  <text x="540" y="788" class="bullet">• AWS Budgets soft alerts at $50 / $100; &lt; $2.50 / day target</text>
  <text x="540" y="810" class="bullet">• Guardrails: PII redaction + prompt-injection defense</text>

  <text x="1010" y="744" class="bullet">• MVP is READ-ONLY — zero write to production runtimes</text>
  <text x="1010" y="766" class="bullet">• Evidence-based AI — cite log lines or return NO_ANOMALY</text>
  <text x="1010" y="788" class="bullet">• Human-in-the-loop — NO automated remediation</text>
  <text x="1010" y="810" class="bullet">• OUT of scope: SNS/Slack/email, VPC PrivateLink, billing</text>
</svg>
