# =============================================================================
# Urbani Observability — production-shaped local/prod compose (Parts 4, 5, 34).
#
# Topology:
#   Browser -> frontend (nginx reverse proxy, :8080)
#                 ├── /            -> SPA static assets
#                 └── /api/*       -> $BACKEND_UPSTREAM (compose: backend:4000, internal network only)
#   backend  -> SQLite on a named volume (persists across restarts/rebuilds)
#
# The SAME images run in local Docker, staging, and production — only the
# injected environment differs (Part 5). Start everything with:
#   docker compose up -d --build
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    image: urbani/backend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # SQLite lives on the mounted volume so data survives container replacement.
      DATABASE_URL: /data/urbani.sqlite
      # sqlite (default) | dynamodb. For dynamodb start DynamoDB Local (profile dynamodb) and set DYNAMODB_ENDPOINT=http://dynamodb-local:8000.
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DYNAMODB_TABLE_PREFIX: ${DYNAMODB_TABLE_PREFIX:-Urbani}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      # SSO (OIDC). Defaults keep local password login. Secrets via env file only.
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_ALLOWED_EMAIL_DOMAIN: ${OIDC_ALLOWED_EMAIL_DOMAIN:-}
      OIDC_EMAIL_ROLE_MAP: ${OIDC_EMAIL_ROLE_MAP:-}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-true}
      INTEGRATION_MODE: ${INTEGRATION_MODE:-mock}
      # Automatic alert notifications (docs/NOTIFICATIONS.md). E-mail: SMTP (Google Workspace) wins over SNS when SMTP_HOST is set.
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      NOTIFICATIONS_DRY_RUN: ${NOTIFICATIONS_DRY_RUN:-false}
      NOTIFICATIONS_ALLOW_MOCK: ${NOTIFICATIONS_ALLOW_MOCK:-false}
      ALERT_POLL_MINUTES: ${ALERT_POLL_MINUTES:-5}
      NOTIFICATIONS_MAX_ALERT_AGE_MINUTES: ${NOTIFICATIONS_MAX_ALERT_AGE_MINUTES:-60}
      NOTIFICATIONS_LOG_RETENTION_DAYS: ${NOTIFICATIONS_LOG_RETENTION_DAYS:-90}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_ROLES: ${ALERT_EMAIL_ROLES:-}
      ALERT_SNS_TOPIC_ARN: ${ALERT_SNS_TOPIC_ARN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      # Real Urbani QA API (Phase 3). Secrets come from .env / secret manager,
      # never committed. When set with INTEGRATION_MODE=live, logs + alerts + chat
      # become LIVE (Amazon Bedrock Nova 2 Lite via POST /chat).
      URBANI_API_BASE_URL: ${URBANI_API_BASE_URL:-}
      URBANI_API_KEY: ${URBANI_API_KEY:-}
      URBANI_SERVICE: ${URBANI_SERVICE:-main}
      URBANI_SERVICES: ${URBANI_SERVICES:-main,payments}
      URBANI_ENVIRONMENT: ${URBANI_ENVIRONMENT:-qa}
      URBANI_REFRESH_MINUTES: ${URBANI_REFRESH_MINUTES:-5}
      URBANI_LOGS_HISTORY_LIMIT: ${URBANI_LOGS_HISTORY_LIMIT:-20}
      URBANI_CHAT_MODEL_ID: ${URBANI_CHAT_MODEL_ID:-global.amazon.nova-2-lite-v1:0}
      URBANI_CHAT_TIMEOUT_MS: ${URBANI_CHAT_TIMEOUT_MS:-30000}
      URBANI_ALERTS_HISTORY_LIMIT: ${URBANI_ALERTS_HISTORY_LIMIT:-5}
      # Same-origin behind the proxy => no CORS allow-list needed.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@urbani.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCOUNT_ID: ${AWS_ACCOUNT_ID:-}
      CLOUDWATCH_LOG_GROUP: ${CLOUDWATCH_LOG_GROUP:-/aws/ecs/urbaniqa-qa-main/app}
      BEDROCK_PRIMARY_MODEL_ID: ${BEDROCK_PRIMARY_MODEL_ID:-global.amazon.nova-2-lite-v1:0}
      BEDROCK_FALLBACK_MODEL_ID: ${BEDROCK_FALLBACK_MODEL_ID:-global.amazon.nova-2-lite-v1:0}
      BEDROCK_GUARDRAIL_ID: ${BEDROCK_GUARDRAIL_ID:-0z947gmtk58a}
      BEDROCK_GUARDRAIL_NAME: ${BEDROCK_GUARDRAIL_NAME:-UrbaniQaObservabilityGuardrail}
      BEDROCK_GUARDRAIL_VERSION: ${BEDROCK_GUARDRAIL_VERSION:-1}
    volumes:
      - urbani_data:/data
    networks:
      - urbani_net
    healthcheck:
      # The container probes ITS OWN liveness endpoint over loopback. This is not
      # a cross-service host assumption — inside a container, 127.0.0.1 is that
      # same container. Other services never address the backend this way; they
      # use the Docker service name "backend".
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    image: urbani/frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # The ONLY browser-facing port. Map host:container.
      - "${FRONTEND_PORT:-8080}:8080"
    environment:
      # Compose: the API is another container, reached by service name. (ECS/awsvpc uses the image default 127.0.0.1:4000.)
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:4000}
    networks:
      - urbani_net

  # DynamoDB Local for DB_DRIVER=dynamodb development/tests. Not started by default:
  #   docker compose --profile dynamodb up -d dynamodb-local
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    profiles: ["dynamodb"]
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "127.0.0.1:8000:8000"   # loopback only
    networks:
      - urbani_net

volumes:
  urbani_data:
    driver: local

networks:
  urbani_net:
    driver: bridge
